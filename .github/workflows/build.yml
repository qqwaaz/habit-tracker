name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: 生成 Android 工程骨架
        run: |
          flutter create --org com.example --project-name habit_tracker --platforms=android /tmp/scaffold
          rm -rf "$GITHUB_WORKSPACE/android"
          cp -r /tmp/scaffold/android "$GITHUB_WORKSPACE/"

      - name: 修补 Android 配置
        run: |
          python3 - <<'PYEOF'
          import pathlib, re

          mf = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = mf.read_text()
          perms = (
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n'
              '    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    '
          )
          s = s.replace('<application', perms + '<application', 1)
          receivers = (
              '\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
              '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
              '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
              '                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n'
              '            </intent-filter>\n'
              '        </receiver>\n    '
          )
          s = s.replace('</application>', receivers + '</application>', 1)
          mf.write_text(s)

          bg = None
          for name in ['build.gradle', 'build.gradle.kts']:
              p = pathlib.Path('android/app') / name
              if p.exists():
                  bg = p
                  break
          if bg is None:
              raise SystemExit('build.gradle not found')

          s = bg.read_text()
          if bg.suffix == '.kts':
              s = re.sub(r'(sourceCompatibility\s*=\s*JavaVersion\.VERSION_[\d_]+)',
                         r'\1\n            isCoreLibraryDesugaringEnabled = true', s, count=1)
              dep = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n'
          else:
              s = re.sub(r'(sourceCompatibility\s*=?\s*JavaVersion\.VERSION_[\d_]+)',
                         r'\1\n        coreLibraryDesugaringEnabled true', s, count=1)
              dep = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n"

          if 'dependencies {' in s:
              s = s.replace('dependencies {', 'dependencies {\n' + dep, 1)
          else:
              s = s.rstrip() + '\n\ndependencies {\n' + dep + '}\n'

          bg.write_text(s)
          print('patched ok')
          PYEOF

      - name: 拉取依赖
        run: flutter pub get

      - name: 编译 APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
